他の製品は、その製品の公式ドキュメントを確認してください。
根拠のリンク、確認した条件、未確認事項を分けて短く返してください。
資料からの推論は推論と明示し、コードは変更しないでください。
"""

[mcp_servers.openaiDeveloperDocs]
