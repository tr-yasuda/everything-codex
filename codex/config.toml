model = "gpt-6.1-sol"
review_model = "gpt-6.2-sol"

model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_reasoning_summary = "auto"

developer_instructions = """
推論量には low・medium・high だけを使ってください。
subagent を起動するときは、役割を目安に依頼の難しさで推論量を選び、
reasoning_effort に明示してください。
- low: 範囲が明確な検索・抜粋・一覧化。
- medium: 通常の調査・実装。判断に迷う場合も medium。
- high: 複雑な原因分析・実装・レビュー。
subagent への依頼文にも、この選択基準と3段階の制約を記載してください。
再委譲する場合も、同じ規約を依頼文に引き継ぐよう指示してください。
推論量を変えるために、各エージェントのモデルを切り替えないでください。
"""

approval_policy = "on-request"
approvals_reviewer = "auto_review"

sandbox_mode = "workspace-write"

web_search = "live"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "~/.cache/mise",
  "~/.local/share/mise",
  "~/.local/state/mise",
  "~/.local/share/pnpm/store",
]

[windows]
sandbox = "elevated"

[features]
prevent_idle_sleep = true
memories = true

[agents]
enabled = true
max_concurrent_threads_per_session = 20
default_subagent_model = "gpt-6.2-sol"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
description = "コードを変更せず、変更対象と影響範囲を調査する。"
config_file = "openai-agents/explorer.toml"

[agents.implementer]
description = "指定された実装タスクを完了する。"
config_file = "openai-agents/implementer.toml"

[agents.reviewer]
description = "変更の正しさ、回帰、テスト不足を確認する。"
config_file = "openai-agents/reviewer.toml"

[agents.verifier]
description = "実際に動かして、要求した振る舞いが成立するかを確認する。"
config_file = "openai-agents/verifier.toml"

[agents.docs_researcher]
description = "公式ドキュメントやリリースノートを調査する。"
config_file = "openai-agents/docs-researcher.toml"

[tui]
collapse_turn_details = true
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[model_providers.opencode-go]
name = "OpenCode Go"
base_url = "https://opencode.ai/inference/go/openai/v1"
env_key = "OPENCODE_API_KEY"
wire_api = "responses"

