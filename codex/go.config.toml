model = "deepseek-v4.1-flash"
model_provider = "opencode-go"
model_reasoning_effort = "high"
model_catalog_json = "go-models.json"

developer_instructions = """
subagent を起動するときは、対象モデルが受け付ける reasoning effort を指定してください。
- deepseek-v4.1-flash: low、high、max。通常の難易度には high、最も難しい作業には max を使う。
再委譲する場合も、同じ規約を依頼文に引き継いでください。
"""

[agents]
default_subagent_model = "deepseek-v4.1-flash"
default_subagent_reasoning_effort = "high"

[agents.explorer]
config_file = "go-agents/explorer.toml"

[agents.docs_researcher]
config_file = "go-agents/docs-researcher.toml"

[agents.implementer]
config_file = "go-agents/implementer.toml"

[agents.reviewer]
config_file = "go-agents/reviewer.toml"

[agents.verifier]
config_file = "go-agents/verifier.toml"

[model_providers.opencode-go]
name = "OpenCode Go"
base_url = "https://opencode.ai/inference/go/openai/v1"
env_key = "OPENCODE_API_KEY"
wire_api = "responses"
