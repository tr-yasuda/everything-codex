interface:
  display_name: "Conventional Commits"
  short_description: "現在の変更を Conventional Commit で commit"
  default_prompt: >-
    Use $conventional-commits to inspect the current changes, choose a single
    Conventional Commit theme, and commit only after all required details are
    determined. Treat requests such as "commitして",
    "この変更をコミットして", and "$conventional-commits" as commit requests.
    Reuse an already confirmed commit-message language when available; otherwise
    ask once before committing. Stop when the changes should be split or cannot
    be committed safely as a single commit.
