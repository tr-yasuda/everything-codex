on:
  pull_request:
  push:
    branches:
      - main


jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: lint

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: lint markdown
        run: pnpm lint:md

      - name: lint spell
        run: pnpm lint:spell

      - name: lint text
        run: pnpm lint:text
